---
- name: Verify
  hosts: all
  vars_files:
    - ../../defaults/main.yml
    - vars.yml
  tasks:
    - name: Check fail2ban service is running.
      ansible.builtin.systemd:
        name: fail2ban
      register: fail2ban_service
      failed_when: fail2ban_service.status.ActiveState != 'active'

    - name: Check unattended-upgrades service is enabled and running.
      ansible.builtin.systemd:
        name: unattended-upgrades
      register: base_unattended_upgrades_svc
      failed_when: >-
        base_unattended_upgrades_svc.status.ActiveState != 'active'
        or base_unattended_upgrades_svc.status.UnitFileState != 'enabled'

    - name: Check sshd service is running.
      ansible.builtin.systemd:
        name: ssh
      register: base_sshd_svc
      failed_when: base_sshd_svc.status.ActiveState != 'active'

    - name: Validate sshd configuration.
      ansible.builtin.command:
        cmd: sshd -t
      changed_when: false
