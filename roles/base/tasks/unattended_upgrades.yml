---

- name: Install unattended-upgrades.
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present

- name: Configure apt periodic unattended-upgrades.
  ansible.builtin.template:
    src: templates/20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: '0644'

- name: Disable unattended-upgrades automatic reboot.
  ansible.builtin.copy:
    src: files/51tesseract-unattended-upgrades
    dest: /etc/apt/apt.conf.d/51tesseract-unattended-upgrades
    owner: root
    group: root
    mode: '0644'

- name: Manage unattended-upgrades service.
  ansible.builtin.service:
    name: unattended-upgrades
    state: "{{ 'started' if base_unattended_upgrades_enabled else 'stopped' }}"
    enabled: "{{ base_unattended_upgrades_enabled }}"
