---

- name: Install time sync packages.
  ansible.builtin.apt:
    name:
      - systemd-timesyncd
      - tzdata
    state: present

- name: Get current timezone.
  ansible.builtin.command:
    cmd: timedatectl show -p Timezone --value
  register: base_timezone_current
  changed_when: false

- name: Set timezone.
  when: base_timezone_current.stdout != base_timezone
  ansible.builtin.command:
    cmd: "timedatectl set-timezone {{ base_timezone }}"
  changed_when: true

- name: Enable systemd-timesyncd.
  ansible.builtin.service:
    name: systemd-timesyncd
    state: started
    enabled: true
