---

- name: Restart sshd.
  listen: restart sshd
  ansible.builtin.service:
    name: ssh
    state: restarted

- name: Restart fail2ban.
  listen: restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted

- name: Reload systemd daemon.
  listen: reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Reload systemd and restart tesseract-rfkill.
  listen: reload tesseract-rfkill
  ansible.builtin.systemd:
    name: tesseract-rfkill
    state: restarted
    enabled: true
    daemon_reload: true
