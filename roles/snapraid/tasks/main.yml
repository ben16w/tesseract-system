---

- name: Assert that all required inputs have been provided.
  ansible.builtin.assert:
    that:
      - snapraid_version is not none
      - tesseract_email_username is not none
      - tesseract_email_host is not none
      - tesseract_email_port is not none
      - tesseract_email_password is not none
      - tesseract_hostname is not none

- name: Install C Compiler with package manager.
  ansible.builtin.package:
    name:
      - gcc
      - make
      - git
      - cron
    state: present
    update_cache: true

- name: Ensure snapraid directory exists.
  ansible.builtin.file:
    path: /var/snapraid/
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Read installed Snapraid version.
  ansible.builtin.command: snapraid --version
  register: snapraid_installed_version
  failed_when: false
  changed_when: false

- name: Download and install Snapraid if required.
  when: snapraid_installed_version.rc != 0 or snapraid_version not in snapraid_installed_version.stdout
  block:

    - name: Remove previous Snapraid build directory.
      ansible.builtin.file:
        path: /tmp/snapraid-{{ snapraid_version }}
        state: absent

    - name: Download and extract snapraid archive into tmp directory.
      ansible.builtin.unarchive:
        src: "https://github.com/amadvance/snapraid/\
          releases/download/v{{ snapraid_version }}/snapraid-{{ snapraid_version }}.tar.gz"
        dest: /tmp
        remote_src: true
      register: download_snapraid
      retries: 5
      delay: 10
      until: download_snapraid is succeeded

    - name: Configure Snapraid install.
      ansible.builtin.command:
        cmd: ./configure
        chdir: /tmp/snapraid-{{ snapraid_version }}
      changed_when: true

    - name: Run make Snapraid.
      ansible.builtin.command:
        cmd: make
        chdir: /tmp/snapraid-{{ snapraid_version }}
      changed_when: true

    # The SnapRAID upstream test suite is unreliable in container
    # environments on Debian (make check fails with parity file I/O
    # errors).  The tests can be re-enabled when upstream stabilises.
    # - name: Run make check Snapraid.
    #   ansible.builtin.command:
    #     cmd: make check
    #     chdir: /tmp/snapraid-{{ snapraid_version }}
    #     creates: /tmp/snapraid-{{ snapraid_version }}/test.log

    - name: Run make install Snapraid.
      ansible.builtin.command:
        cmd: make install
        chdir: /tmp/snapraid-{{ snapraid_version }}
      changed_when: true

- name: Ensure snapraid-runner directory exists.
  ansible.builtin.file:
    path: /opt/snapraid-runner
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Clone snapraid-runner git repository.
  ansible.builtin.git:
    repo: https://github.com/Chronial/snapraid-runner.git
    dest: /opt/snapraid-runner
    version: master
  register: download_snapraid_runner
  retries: 5
  delay: 10
  until: download_snapraid_runner is succeeded

- name: When data disks and parity disks are not empty.
  when: snapraid_data_disks | length > 0 and snapraid_parity_disks | length > 0
  block:

    - name: Template snapraid configuration file.
      ansible.builtin.template:
        src: snapraid.conf.j2
        dest: /etc/snapraid.conf
        owner: root
        group: root
        mode: '0644'

    - name: Template snapraid-runner configuration file.
      ansible.builtin.template:
        src: snapraid-runner.conf.j2
        dest: /opt/snapraid-runner/snapraid-runner.conf
        owner: root
        group: root
        mode: '0644'

    - name: Make sure data disks paths exist.
      loop: "{{ snapraid_data_disks }}"
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'

    - name: Make sure parity disks paths exist.
      loop: "{{ snapraid_parity_disks }}"
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'

    - name: Ensure snapraid-runner cron job is present.
      ansible.builtin.cron:
        name: "Snapraid runner."
        minute: "0"
        hour: "{{ snapraid_cron_hour }}"
        job: >
          python3 /opt/snapraid-runner/snapraid-runner.py
          --conf /opt/snapraid-runner/snapraid-runner.conf
        state: present

- name: Ensure snapraid-runner cron job is absent.
  when: snapraid_data_disks | length == 0 or snapraid_parity_disks | length == 0
  ansible.builtin.cron:
    name: "Snapraid runner."
    state: absent
