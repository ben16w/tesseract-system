---
- name: Converge
  hosts: all
  vars_files:
    - ../../defaults/main.yml
    - vars.yml
  pre_tasks:
    - name: Create samba share directory.
      ansible.builtin.file:
        path: /media/storage/public
        state: directory
        mode: '0755'
  roles:
    - role: tesseract.system.samba
