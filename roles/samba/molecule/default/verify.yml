---
- name: Verify
  hosts: all
  vars_files:
    - ../../defaults/main.yml
    - vars.yml
  tasks:
    - name: Check samba service is running.
      ansible.builtin.systemd:
        name: smbd
      register: smbd_service
      failed_when: smbd_service.status.ActiveState != 'active'

    - name: Check nmbd state.
      ansible.builtin.command:
        cmd: systemctl is-enabled nmbd
      register: nmbd_enabled
      changed_when: false
      failed_when: false

    - name: Assert nmbd is disabled.
      ansible.builtin.assert:
        that:
          - nmbd_enabled.stdout == 'disabled'

    - name: Read samba configuration.
      ansible.builtin.slurp:
        path: /etc/samba/smb.conf
      register: samba_config

    - name: Assert samba configuration contains the shared directory.
      ansible.builtin.assert:
        that:
          - "'[public]' in (samba_config.content | b64decode)"
          - "'valid users = tesseract' in (samba_config.content | b64decode)"

    - name: Check samba user exists in passdb.
      ansible.builtin.command:
        cmd: pdbedit -L
      register: samba_users
      changed_when: false

    - name: Assert tesseract samba user exists.
      ansible.builtin.assert:
        that:
          - "'tesseract:' in samba_users.stdout"
